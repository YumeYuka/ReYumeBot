services:
  reyumebot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yumeyuka/reyumebot:latest
    container_name: reyumebot
    restart: unless-stopped
    working_dir: /app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      BILIBILI_ADMIN_ID: ${BILIBILI_ADMIN_ID:-}
    volumes:
      - ./data:/app/data